[package]
name = "grh"
description = "One command to install, audit and remove the Green Harness parts"
version = "0.4.0"
license = "MIT"
repository = "https://github.com/greenharness/grh"
edition = "2021"
# std::fs::File::lock (the receipt lock) is stable since 1.89.
rust-version = "1.89"

# Every dependency comes from crates.io, so `cargo install grh` works.
[dependencies]
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
toml = "0.8"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
# ratatui draws the install checklist; the version amont-fleet uses, with the
# crossterm backend only (the default features add macros and widgets the
# checklist does not draw). It pulls ratatui-core, ratatui-widgets and
# ratatui-crossterm; releases roughly monthly; if abandoned, the checklist
# falls back to the part listing and the model in src/checklist.rs stays.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
# crossterm reads keys and sets raw mode for the checklist, at amont-fleet's
# version; it pulls rustix and signal-hook; slow, steady releases; if
# abandoned, raw mode moves to rustix.
crossterm = "0.29"
# signal-hook turns SIGTERM and SIGHUP into a flag the checklist loop reads,
# so the terminal is restored before grh exits; the version crossterm already
# pulls in, so it adds no crate.
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"
# rexpect drives the checklist through a pseudo-terminal in tests/pty.rs
# (MIT OR Apache-2.0, rust-version 1.85).
rexpect = { version = "=0.7.1", default-features = false }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
needless_pass_by_value = "warn"
redundant_clone = "warn"

[profile.release]
strip = true
lto = true
codegen-units = 1
