# greenbelay's manifest for grh (Green Harness), the v2 format of grh's
# docs/extension-manifest.md. grh pins the copy each release publishes.
#
# No sums here, and no [tool.release]: the tarballs this would describe do
# not exist when the file is committed. The release job writes
# [tool.release] (repo, version, the sha256 of each unix tarball) into a copy
# in dist/ before SHA256SUMS is computed (scripts/release-manifest.py).
# The release guard checks [extension] version against the tag.

[extension]
name = "greenbelay"
version = "6.1.0"
harness = ">=0.3"
summary = "what an agent's tool call may do: a Claude Code hook"
needs = []
aliases = ["guardrails"]

# One name, no alias binary (ADR-0071).
[tool]
bin = "greenbelay"

[tool.machine]
install = ["{bin}", "install", "--write"]
uninstall = ["{bin}", "uninstall", "--write"]
requires = ["claude"]
[tool.machine.status]
args = ["doctor", "--json"]
json = ["integration", "state"]

[[recommend]]
when = ["machine_present"]
verdict = "already here"
reason = "greenbelay's integration is installed"

[[recommend]]
when = []
verdict = "recommend"
reason = "a git repository: keep agents inside the rules"

# Written by scripts/release-manifest.py from the release's own tarballs.
[tool.release]
repo = "greenharness/greenbelay"
version = "6.1.0"
[tool.release.sha256]
aarch64-apple-darwin = "5fefbe6ceeac9db6ad166eab1c77872394a34c175cf2230f18292beb192acc69"
x86_64-apple-darwin = "fe1e2c52bb25d0fe3362d31a0a0d97be0554c870bad95fd55aca8ba2e6bc218d"
aarch64-unknown-linux-gnu = "32b33b03fcb82ff72e666b3a982238b94b15f124c393f45c5bd5edfc79342ce3"
x86_64-unknown-linux-gnu = "a88b912cd3c8bd354590c80d2c059bdf43c98569e98799861dd5081e8d103c4c"
