name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    if: github.event_name != 'schedule'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: no part names
        run: cargo test --test no_part_names
      - run: cargo test

  deny:
    if: github.event_name != 'schedule'
    # cargo-deny is fetched through the API asset endpoint (`gh release
    # download`), not the web download route: the action's `curl --silent`
    # of that route got 504 pages for hours on 2026-11-08 and fed them to
    # tar. The tarball is pinned by sha256; the check is the action's
    # default command line.
    runs-on: ubuntu-latest
    env:
      DENY_VERSION: "0.20.2"
      DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny
        run: |
          set -euo pipefail
          name="cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl"
          for attempt in 1 2 3; do
            if gh release download "$DENY_VERSION" -R EmbarkStudios/cargo-deny \
                -p "$name.tar.gz" -D "$RUNNER_TEMP" --clobber; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
          echo "$DENY_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/$name/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
      - run: cargo deny --log-level warn --manifest-path ./Cargo.toml --all-features check

  # Every pinned manifest, downloaded again and compared with its pin and its
  # copy. Exit codes are the example's own: 1 mismatch, missing asset or
  # refusal, 2 usage, 3 host unreachable. On a pull request an outage (3) is a
  # warning; a nightly or manual run fails on it too.
  pinned-manifests:
    name: pinned manifests
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: check pins
        shell: bash
        run: |
          set +e
          # the command `make pins-check` runs, called directly: make would
          # turn every failing exit into 2 and hide 3 (an outage)
          cargo run --locked --example pins -- check
          code=$?
          set -e
          if [ "$code" = 3 ] && [ "${{ github.event_name }}" = pull_request ]; then
            echo "::warning::a pinned manifest's host was unreachable; not a failure on a pull request"
            exit 0
          fi
          exit "$code"

  msrv:
    if: github.event_name != 'schedule'
    # A `rust-version` nobody compiles against is a comment with syntax.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: msrv
        run: echo "v=$(grep '^rust-version' Cargo.toml | head -1 | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install ${{ steps.msrv.outputs.v }} --profile minimal
      - run: cargo +${{ steps.msrv.outputs.v }} build

  # As a new user would: install.sh from this build, every part from its real
  # release into a fixture repository, then a bare uninstall that must leave
  # the scratch HOME as it found it.
  e2e:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --locked --bin grh
      - run: scripts/e2e.sh target/release/grh
        env:
          GH_TOKEN: ${{ github.token }}
