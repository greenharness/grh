name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  msrv:
    # A `rust-version` nobody compiles against is a comment with syntax.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: msrv
        run: echo "v=$(grep '^rust-version' Cargo.toml | head -1 | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install ${{ steps.msrv.outputs.v }} --profile minimal
      - run: cargo +${{ steps.msrv.outputs.v }} build

  # As a new user would: install.sh from this build, every part from its real
  # release into a fixture repository, then a bare uninstall that must leave
  # the scratch HOME as it found it.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --locked --bin grh
      - run: scripts/e2e.sh target/release/grh
        env:
          GH_TOKEN: ${{ github.token }}
