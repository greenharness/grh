# The parts grh knows, compiled into the binary (ADR-0050, ADR-0064).
#
# Each [[part]] is a greenharness.toml v2 manifest (docs/extension-manifest.md)
# held here for a part whose repository ships none yet: its binary and the
# release it pins (version and the sha256 of each target's tarball, copied
# from that release's SHA256SUMS), the
# tool's own commands that place and remove its integration, and the status
# query that says whether it is there. grh never writes a tool's config
# itself: it runs these commands.
#
# `{bin}` is the absolute path of the part's binary. A status query's `args`
# run that binary; its answer is an exit-code pair or a state word at a JSON
# path: present / absent / partial, anything else is unknown.
#
# A part whose repository ships its own manifest is a [[pinned]] entry
# instead (name, repo, tag, asset, sha256): its copy lives in manifests/ and is
# built into grh, checked against the pin at load. `cargo run --example pins --
# pin <name> <repo> <tag>` fetches a copy and prints the entry; `make
# pins-check` re-downloads every pin (docs/extension-manifest.md, "Shipping a
# manifest").
#
# `order` is ADR-0064's list of the parts, in catalog names. Every `needs` and
# `enhances` edge points to an earlier entry; Catalog::checked refuses the rest.

skills_repo = "greenharness/skills"
skills_version = "0.22.0"
skills_sha256 = "9fc4aaa8fb3711338d2c214095e8ed7a941a57c03622a10e7b00490c87db3c21"
foreign_markers = ["relais:begin"]
order = ["decisions", "greengate", "greenbelay", "router", "conform", "greensummit", "workflow", "design"]

# Names that installed several parts before 0.3.0, with their former members.
# grh refuses them with a hint (Catalog::checked: no part name or alias, and
# every member a published part).
[retired_names]
solo = ["greengate", "greenbelay"]
team = ["greengate", "greenbelay", "decisions", "conform"]
full = ["greengate", "greenbelay", "decisions", "conform", "router"]

[audit]
adr_folder = [".adr.yaml", "docs/adr", "docs/decisions", "doc/adr"]
claude_set_up = [".claude", "CLAUDE.md", "AGENTS.md"]
ci_present = [".github/workflows", ".forgejo/workflows"]

[[pinned]]
name = "greengate"
repo = "greenharness/greengate"
tag = "v4.11.0"
sha256 = "99589f84c3b17e4dba92dd1e0bd04fa8cc193473656c522c102987cf10b2b041"

[[pinned]]
name = "greenbelay"
repo = "greenharness/greenbelay"
tag = "v6.2.0"
sha256 = "d82ed3b089674c52992cba93dd148f3125fae4d8b3ceab4aa2e811fe3fa955d4"

[[part]]
[part.extension]
name = "decisions"
version = "2.0.0"
harness = ">=0.3"
summary = "what is decided: architecture decision records, resolved"
needs = []

[part.tool]
bin = "greentopo"
[part.tool.release]
repo = "greenharness/greentopo"
version = "2.0.0"
[part.tool.release.sha256]
aarch64-apple-darwin = "30a3fae1eb59a5e5e94271950975bcabd4486d1585e5dd4621b24c6195e54013"
x86_64-apple-darwin = "912d9de53f9ce10c7342854e18fedb12d42419273052c81eef982191a6c67557"
aarch64-unknown-linux-gnu = "6c62826f9f0a1c7db6b4f30c73cf6198cdca609b0323ae04d446aaaf2d7d5129"
x86_64-unknown-linux-gnu = "f1c39c749d46fd21e3c12c4aacb3153f59074eb701b3bdab370181bce25b2501"
[part.tool.machine]
install = ["{bin}", "mcp", "install", "--write"]
uninstall = ["{bin}", "mcp", "uninstall", "--write"]
requires = ["claude"]
[part.tool.machine.status]
args = ["mcp", "install", "--check"]
exit = { present = 0, absent = 1 }
[part.tool.repo_level]
install = ["{bin}", "hook", "install"]
uninstall = ["{bin}", "hook", "uninstall", "--write"]
[part.tool.repo_level.status]
args = ["hook", "uninstall", "--check"]
exit = { present = 1, absent = 0 }

[part.bundle]
skills = ["relais-architecture-conflict"]

[[part.recommend]]
when = ["adr_folder", "machine_present"]
verdict = "already here"
reason = "greentopo is registered with Claude Code"

[[part.recommend]]
when = ["adr_folder"]
verdict = "recommend"
reason = "decisions live in {adr_folder}"

[[part.recommend]]
when = []
verdict = "not useful"
reason = "no ADR folder"

[[part]]
[part.extension]
name = "conform"
version = "0.20.1"
harness = ">=0.3"
summary = "which decided code rules a tree breaks, by lint"
needs = ["decisions"]
hint = "in a repository: greenspotter sync, and for TypeScript: pnpm add -D @greenharness/greenspotter-eslint-config"
# Repo level writes nothing: `greenspotter sync` rewrites lint configs the
# repository owns, so grh prints the commands instead.

[part.tool]
bin = "greenspotter"
[part.tool.release]
repo = "greenharness/greenspotter"
version = "0.20.1"
[part.tool.release.sha256]
aarch64-apple-darwin = "2163991646d3b1243d8a695956f178c640bcbd3e658a3a6fda374b0a38235856"
x86_64-apple-darwin = "f2815ba76bf6be244f412ea39ce1c6df272a5243b64edc8aa4029a823a089b0a"
aarch64-unknown-linux-gnu = "e06b9bfe9332399624b08a6643d2ad3460564628137d0e8f63cd83d8c26d4442"
x86_64-unknown-linux-gnu = "f14ec614e7304ef716b27ef8301f60d9295739e0a149399474c4f29b30a64c6b"

[[part.recommend]]
when = ["adr_folder", "language_supported"]
verdict = "recommend"
reason = "{adr_folder} plus a supported language"

[[part.recommend]]
when = ["adr_folder"]
verdict = "not useful"
reason = "no supported language (rust, typescript/javascript, python, go)"

[[part.recommend]]
when = []
verdict = "not useful"
reason = "no ADR folder to conform to"

[[part]]
[part.extension]
name = "router"
version = "0.39.0"
harness = ">=0.4"
experimental = true
summary = "which model runs a bounded task, verified and accounted"
needs = []

[part.tool]
bin = "relais"
[part.tool.release]
repo = "fredericrous/relais"
version = "0.39.0"
[part.tool.release.sha256]
aarch64-apple-darwin = "aa3a27c88e8102f2cd92495d5d05e45ba83b45f469109c363821f9dfcee5e639"
x86_64-apple-darwin = "c6fb9b233500e34f05cdefcfdbc0e9f33a8438d7b77b80bb45cc73d10d0ac95f"
aarch64-unknown-linux-gnu = "9e53a39d04cd69fef0a1d233a0d3e2528f68e404be5cf85860d503964b021dd5"
x86_64-unknown-linux-gnu = "b87768ec14b0c55c29a512156a6cc8f94e660733bb3670be874cf271ae26b455"
[part.tool.machine]
install = ["{bin}", "install", "--claude", "--user", "--write"]
uninstall = ["{bin}", "uninstall", "--claude", "--user", "--write"]
requires = ["claude"]
[part.tool.machine.status]
args = ["doctor", "--json"]
json = ["integration", "state"]

[[part.recommend]]
when = ["claude_set_up", "machine_present"]
verdict = "already here"
reason = "relais's integration is installed"

[[part.recommend]]
when = ["claude_set_up"]
verdict = "recommend"
reason = "Claude Code is set up ({claude_files})"

[[part.recommend]]
when = []
verdict = "not useful"
reason = "Claude Code is not set up here"

[[part]]
[part.extension]
name = "greensummit"
version = "0.2.0"
harness = ">=0.3"
summary = "CI skips what your laptop already checked, on a signed tree"
needs = ["greengate"]
aliases = ["attest"]
# No binary on the machine: CI verifies, greengate signs at pre-push.

[[part.repo_file]]
dirs = [".forgejo", ".github"]
path = "workflows/attest.yml"
content = '''
name: attest
on:
  pull_request:
jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: greenharness/greensummit@v2
'''

[[part.recommend]]
when = ["repo_file_here"]
verdict = "already here"
reason = "an attest workflow exists"

[[part.recommend]]
when = ["ci_present"]
verdict = "recommend"
reason = "CI in {ci}"

[[part.recommend]]
when = []
verdict = "not useful"
reason = "no CI workflows"

