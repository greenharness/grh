summary = "plans reviewed by a panel, one worktree per task, merge on green"
needs = ["gate", "guardrails"]
skills = [
  "plan-review", "worktree-task", "worktree-sweep", "diagnosing-bugs", "retro",
  "interface-review", "interface", "accessibility", "layout", "writing",
  "motion-design",
]
agents = [
  "implementation-review", "interface-review",
  "plan-review-architect", "plan-review-backend", "plan-review-game-ux",
  "plan-review-language", "plan-review-platform", "plan-review-po",
  "plan-review-tui", "plan-review-unix", "plan-review-ux-research",
]

[[part]]
name = "design"
summary = "the Duro design system, themed by your tokens (extension)"
needs = []
skills = []
# Installed from its published extension manifest; not published yet.
extension = "unpublished"
