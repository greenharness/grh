x86_64-apple-darwin = "cd37589483102e52c64bfd5dd3eb79d410a33cc9acf096349b30d22eb058b886"
aarch64-unknown-linux-gnu = "66fe403bb6644cadc6179077f52f26977e96167acf2a81f7c27dcaa7959d2e8d"
x86_64-unknown-linux-gnu = "4e69a29c9e887103c00fecd3a5c931ab7c1897ab18e1083781e99a0820c68edf"
[part.machine]
install = ["{bin}", "install", "--write"]
