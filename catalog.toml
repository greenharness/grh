[[part]]
name = "conform"
summary = "which decided code rules a tree breaks, by lint"
needs = ["decisions"]
bin = "adr-lint"
repo = "fredericrous/adr-lint"
version = "0.10.0"
skills = []
# Repo level writes nothing: `adr-lint sync` rewrites lint configs the
# repository owns, so grh prints the commands instead.
hint = "in a repository: adr-lint sync, and for TypeScript: pnpm add -D @aval-adr/eslint-config"
[part.sha256]
aarch64-apple-darwin = "b74785a59a2288ed93dc3422964ac0125ac2d6e0412756a6b318c600c8e831f2"
x86_64-apple-darwin = "973420c1801ab80666617de6fe0b6df94fcf1e34c646a2d8513cce56639bd866"
aarch64-unknown-linux-gnu = "b909f7d5fd47179f59e70654b7df8b8243f907e30b8e655f50788746c6db9093"
x86_64-unknown-linux-gnu = "a945cda1cb28202717c1dd1b5adc0cb7f46405a5c6c6027ca1adc1c5a5ee13bf"

[[part]]
name = "attest"
summary = "CI skips what your laptop already checked, on a signed tree"
needs = ["gate"]
skills = []
# No binary on the machine: CI verifies, gate signs at pre-push.
workflow = "attest"

[[part]]
