bin = "adr-lint"
repo = "fredericrous/adr-lint"
version = "0.17.0"
skills = []
# Repo level writes nothing: `adr-lint sync` rewrites lint configs the
# repository owns, so grh prints the commands instead.
hint = "in a repository: adr-lint sync, and for TypeScript: pnpm add -D @aval-adr/eslint-config"
[part.sha256]
aarch64-apple-darwin = "5e8caa567fcb110d242eaad5b908f9863bad3af772dbb3e2cb017274bbc233d3"
x86_64-apple-darwin = "e6d495d97c3f12d314b27aea57f1164d16701851ee56428369aaf2c29c786b14"
aarch64-unknown-linux-gnu = "17282fe138c814a01b89865653ef1c309983823d220003efcf35799bff685b79"
x86_64-unknown-linux-gnu = "3cd150e8539c733c84bb6c21092beb35700f54b5ddbc7ea1ee5b6b588b921b46"

