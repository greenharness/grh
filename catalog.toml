# The parts grh knows, compiled into the binary (ADR-0050, harness.installer).
#
# Each part names its binary, the release it pins (version and the sha256 of
# each target's tarball, copied from that release's SHA256SUMS by
# `scripts/pin.sh`), the tool's own commands that place and remove its
# integration, and the published query that says whether it is there. grh
# never writes a tool's config itself: it runs these commands.
#
# `{bin}` is the absolute path of the part's binary. `query` names the parser
# in src/owner.rs that reads that tool's answer as present / absent / partial
# / unknown.

skills_repo = "greenharness/skills"
skills_version = "0.2.0"
skills_sha256 = "a08b98254882735df0c27101710af19b9efcb9d0670a59556e0e6a19e4a4c148"

[profiles]
solo = ["gate", "guardrails"]
team = ["gate", "guardrails", "decisions", "conform"]
full = ["gate", "guardrails", "decisions", "conform", "router"]

[[part]]
name = "decisions"
summary = "what is decided: architecture decision records, resolved"
needs = []
bin = "aval"
repo = "fredericrous/aval"
version = "1.12.0"
skills = ["relais-architecture-conflict"]
[part.sha256]
aarch64-apple-darwin = "698b87990cd9519c4f97381befc43a92664cf8228ebd6e1e9d4ad0c31c987d05"
x86_64-apple-darwin = "81c207b715637663fed2968230c4f4a4127536ab9bd9c0fb85f3eea2848b5d11"
aarch64-unknown-linux-gnu = "01f36eedf558a092516b6dc981aabb6a0aa384584b60fac02fb46f61d69c8bad"
x86_64-unknown-linux-gnu = "59afa75d613b7d899d86963b253df2ccd98606d5991cf49f4195b640e5feb26a"
[part.machine]
install = ["{bin}", "mcp", "install", "--write"]
uninstall = ["{bin}", "mcp", "uninstall", "--write"]
query = "aval-mcp"
[part.repo_level]
install = ["{bin}", "hook", "install"]
uninstall = ["{bin}", "hook", "uninstall", "--write"]
query = "aval-hook"

[[part]]
name = "gate"
summary = "what a commit or a push may carry: git hooks"
needs = []
bin = "amont"
repo = "fredericrous/amont"
version = "1.64.0"
skills = ["relais-verified-push", "merge-when-green", "tag-release"]
[part.sha256]
aarch64-apple-darwin = "b8e943c18abc86340b9f22f355cb4259bfba20fbcebf42183c5d5fcd3b638e00"
x86_64-apple-darwin = "d065f6f7d0df457d71b699fc49fc8bf7347616cb9c2460ae4cd193b97deeb7ca"
aarch64-unknown-linux-gnu = "9a0393d45159dc8e4dd92e8ca467f3cc2fc6ec655101574642dc16e8a535b8b8"
x86_64-unknown-linux-gnu = "bf5c07e7f68c99c27bcb5aef9a983a278fc1f5f911fb8840d2baac4662bcc07e"
# `amont init`, never `amont install`: install copies the binary and fills
# the machine's git template dir, machine state a repo step must not touch.
[part.repo_level]
install = ["{bin}", "init"]
uninstall = ["{bin}", "uninstall", "--repo"]
query = "amont-list"

[[part]]
name = "guardrails"
summary = "what an agent's tool call may do: a Claude Code hook"
needs = []
bin = "amont-agent"
repo = "fredericrous/amont-agent"
version = "3.10.0"
skills = []
[part.sha256]
aarch64-apple-darwin = "bb3bbf814261acf516d3efffa6e6c9b72844b94a8338999afb832bb951746cc4"
x86_64-apple-darwin = "c723eabaff909162dee07a59c05665b38c98dce9d9acfbf94f5a5030c4f4b562"
aarch64-unknown-linux-gnu = "0791abf7197dc362b0ad3bedb5008fc1bfbe02e92528d512ade5f0be0f2d9533"
x86_64-unknown-linux-gnu = "816be047de5fb2e0f340a49ae1c02d4734b5808c5a11a41af65915e706fedb03"
[part.machine]
install = ["{bin}", "install", "--write"]
uninstall = ["{bin}", "uninstall", "--write"]
query = "amont-agent-doctor"

[[part]]
