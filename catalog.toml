[[part]]
[part.extension]
name = "design"
version = "0.1.0"
harness = ">=0.3"
summary = "the greenrack design system, themed by your tokens (extension)"
needs = []
published = false
# Installs from an unpacked manifest (npm pack of @greenharness/greenrack-cli),
# not from a published part, so it stays unpublished here.
# Its audit rules live here until that manifest carries its own.

[[part.recommend]]
when = ["dep:@greenharness/greenrack-"]
verdict = "recommend"
reason = "package.json depends on @greenharness/greenrack-*"

[[part.recommend]]
when = []
