# No binary on the machine: CI verifies, greengate signs at pre-push.

[[part.repo_file]]
dirs = [".forgejo", ".github"]
path = "workflows/attest.yml"
content = '''
name: attest
on:
  pull_request:
jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fredericrous/attest@v1
'''

